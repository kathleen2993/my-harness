# rules.yaml — 게이트 판정 기준 (SSOT)
# 판정에 쓰는 숫자는 이 파일에만 둔다. 에이전트는 의견만 내고, 통과/실패는 판정 스크립트가 이 값으로 정한다.
# ★ = story-service.md의 "어기면 안 되는 것"에서 온 서비스 규칙

gate1:            # p2 기획 직후 (p2_plan.json 검사)
  type_missing: 0               # 타입이 정해지지 않은 슬라이드 수
  required_field_missing: 0     # 타입별 필수 칸이 빈 슬라이드 수
  judgment_needed: 0            # "판단 필요"로 남은 슬라이드 수 (0이 아니면 디자이너에게 질문)
  checklist_max_items: 5        # 체크 항목 최대 개수 (design.md 5)
  slide_count_match: true       # 의뢰서 슬라이드 번호 수 = 기획 슬라이드 수
  price_source_match: true      # ★ 기획의 모든 가격·할인율이 의뢰서 원문에 그대로 있는가 (사전 검사)
  image_instruction_as_text: 0  # "(이미지)" 같은 지시문이 글자 칸에 들어간 수 (지시문은 hasImage / options로 바꾼다)
  image_instruction_pattern: '^\(.*(이미지|누끼|사진|썸네일).*\)$'

gate2:            # p4 검수 (Figma 실제 상태 검사)
  price_mismatch: 0             # ★ 결과물 가격·할인율 텍스트가 의뢰서 원문과 다른 칸 수
  card_detached: 0              # ★ 전면CG_묶음 안에서 인스턴스가 아닌 카드 수 (바깥 375×667 프레임은 제외)
  dummy_text: 0                 # 레이어명 그대로 남은 보이는 글자 수 (예: "#Prd_Title_txt")
  content_missing: 0            # 기획(plan.json)의 글자(상품명·혜택·사은품명 등)가 Figma에 보이지 않는 수
  font_substituted: 0           # 템플릿 폰트와 다른 폰트로 바뀐 글자 수
  slide_count_match: true       # 기획 슬라이드 수 = Figma 전면 수, 순서 01, 02… 일치
  banner_required_if_requested: true   # 의뢰서에 슬림배너가 있으면 슬림배너 묶음이 있어야 함
  empty_slide_required_if_requested: true  # "내용 없는 전면" 요청이 있으면 빈 전면이 있어야 함

retry:
  max_fail_per_gate: 3          # 같은 게이트를 이 횟수만큼 실패하면 멈추고 디자이너 호출

quality:
  classification_accuracy_min: 0.95   # 타입 분류 정확도 목표 (PRD 7). 사람이 고친 비율로 측정
